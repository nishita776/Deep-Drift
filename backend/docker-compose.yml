version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: novataxa
      POSTGRES_PASSWORD: novataxa
      POSTGRES_DB: novataxa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novataxa"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://novataxa:novataxa@db:5432/novataxa
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage

volumes:
  pgdata:
